<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Around the World | Science Quest by Curious Nest</title>
<link rel="icon" type="image/png" href="img/sq-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=44">
<style>
.wtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:14px 0}
.wmap{width:100%;height:auto;display:block;border-radius:18px;background:#DDEFF8}
.wmap .land{fill:#BFE3C8;stroke:#fff;stroke-width:.6}
.wmap .pin{cursor:pointer}
.wmap .pin text{font:800 7px Nunito,sans-serif;fill:var(--ink)}
.wmapbox .wmap{max-width:820px;margin:0 auto}
.wmapbox{background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px;margin:8px 0 18px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin:10px 0 30px}
.wcard{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.wcard:hover{transform:translateY(-3px);border-color:var(--teal)}
.wcard .ic{display:flex;gap:4px}
.wcard h3{font-size:18px;line-height:1.25;margin:0}
.wcard p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5}
.wcard .meta{font-size:13px;font-weight:800;color:var(--muted)}
.wcard.done{border-color:#47A86A}
.wcard .tick{position:absolute;top:12px;right:12px;font-size:22px}
.wtype{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:12.5px;padding:4px 10px;border-radius:99px;width:max-content}
.wtype.news{background:#E6F0FB;color:#2A6FBD}.wtype.diary{background:#FFF0E0;color:#B5650F}
.stamp{display:inline-block;transform:rotate(-6deg);border:3px solid #D2425E;color:#D2425E;font:900 15px Nunito,sans-serif;letter-spacing:2px;padding:4px 12px;border-radius:10px;background:#fff}
.whero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start;margin:20px 0}
@media(max-width:820px){.whero{grid-template-columns:1fr}}
.whero h1{font-size:clamp(26px,3.6vw,38px);line-height:1.15;margin:12px 0 8px}
.wwhere{display:flex;gap:10px;flex-wrap:wrap;font-weight:800;color:var(--ink2);font-size:14.5px}
.wwhere span{background:var(--tealL);color:var(--tealD);padding:5px 11px;border-radius:99px}
.wphoto{margin:0;background:#fff;border:2px solid var(--line);border-radius:20px;overflow:hidden}
.wphoto img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.wphoto .ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#EAF6FB,#F7FBEF)}
.wphoto figcaption{padding:10px 14px;font-size:14px;color:var(--ink2);line-height:1.5;font-style:italic;border-top:2px dashed var(--line)}
.wphoto figcaption b{font-style:normal;color:var(--ink)}
.wbody{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
@media(max-width:900px){.wbody{grid-template-columns:1fr}}
.wtext{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px 26px;font-family:Andika,sans-serif;font-size:19px;line-height:1.75}
.wtext h2{font-family:Nunito,sans-serif;font-size:21px;color:var(--teal);margin:20px 0 4px}
.wtext h2:first-child{margin-top:0}
.wtext p{margin:0 0 6px}
.wtext.diary h2{color:#B5650F}
.wtext.diary{background:#FFFDF6;background-image:repeating-linear-gradient(transparent 0 32px,#EDE6D4 32px 33px)}
.wnote{background:var(--sunL);border-radius:14px;padding:10px 14px;font-size:14.5px;font-weight:700;color:#8a5a08;margin:0 0 14px;font-family:Nunito,sans-serif;line-height:1.5}
.wside{display:flex;flex-direction:column;gap:16px}
.wbox{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px}
.wbox h3{font-size:17px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.fact{width:100%;border-collapse:collapse;font-size:14.5px}
.fact td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top;line-height:1.4}
.fact td:first-child{font-weight:900;color:var(--teal);width:38%}
.wbox.ff{background:#F3FAF9;border-color:#BFE6E2}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--plum)}
.tl li{position:relative;margin:0 0 10px;font-size:14.5px;line-height:1.4}
.tl li:before{content:'';position:absolute;left:-21px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--plum)}
.tl b{color:var(--plum);display:block}
.kstep{display:flex;gap:10px;margin:0 0 8px;font-size:14.5px;line-height:1.4}
.kstep b{background:var(--plum);color:#fff;border-radius:8px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.chart text{font:800 13px Nunito,sans-serif;fill:var(--ink)}
.chart .val{font-weight:900;fill:var(--tealD)}
.cnote{font-size:13px;color:var(--muted);font-weight:700;margin:8px 0 0;line-height:1.45}
.wq{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px;max-width:760px;margin:24px auto}
.wq .qtype{display:inline-block;background:var(--plumL);color:var(--plum);font-weight:900;font-size:13px;padding:4px 12px;border-radius:99px}
.wq h2{font-size:22px;line-height:1.35;margin:12px 0 16px}
.wq .opt{display:block;width:100%;text-align:left;font:700 17px Nunito,sans-serif;padding:14px 16px;margin:0 0 10px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink)}
.wq .opt:hover{border-color:var(--teal)}
.wq .opt.right{background:var(--leafL);border-color:#47A86A}
.wq .opt.wrong{background:#FDECEF;border-color:#E0607E}
.wq .why{background:var(--tealL);border-radius:14px;padding:12px 14px;font-weight:700;color:var(--tealD);margin:6px 0 14px}
.qdots{display:flex;gap:6px;margin:0 0 10px}.qdots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.qdots i.ok{background:#47A86A}.qdots i.no{background:#F6B93B}.qdots i.now{outline:3px solid var(--teal)}
.around{background:#F1EDFC;border:2px dashed var(--plum);border-radius:20px;padding:18px;margin:18px 0}
.around textarea{width:100%;min-height:90px;border:2px solid #D7CDF4;border-radius:12px;padding:10px;font:600 16px Andika,sans-serif;box-sizing:border-box}
.rank{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#FFF5E3,#F1EDFC);border-radius:20px;padding:14px 18px;margin:16px 0}
.rank .med{font-size:40px}
.rank b{font-size:19px}.rank small{display:block;color:var(--ink2);font-weight:700;font-size:14px;margin-top:2px}
.pressbadge{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:3px solid var(--sun);border-radius:20px;padding:16px 22px;margin:10px 0}
.pressbadge .em{font-size:48px}
.wfilter{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
</style>
</head>

<script>
(function(){
  var S = SQ_STORE, A = SQ_ART, W = SQ_WORLD;
  var main = document.getElementById('main');
  var GN = {kg2:'KG2 (Year 1)', g1:'Grade 1 (Year 2)', g2:'Grade 2 (Year 3)', g3:'Grade 3 (Year 4)', g4:'Grade 4 (Year 5)', g5:'Grade 5 (Year 6)'};
  var TOPIC = {space:'Earth and space', evolution:'Evolution and inheritance', materials:'Materials', seasons:'Seasonal changes', plants:'Plants', animals:'Animals including humans', rocks:'Rocks and fossils', light:'Light', forces:'Forces and magnets', states:'States of matter', sound:'Sound', electricity:'Electricity', living:'Living things and their habitats'};
  var TYPE = {news:['📰','News report'], diary:['📔','Diary']};
  var RANKS = [[1,'🗞️','Junior Science Reporter','You have read your first true science story!'],[3,'🎙️','Senior Science Reporter','Three true stories read. You are a real science reporter now.'],[5,'🌍','Chief Science Reporter','Five true stories! You know science from all around the world.'],[10,'🧭','World Science Explorer','Ten true stories! You have travelled the world with science.'],[20,'🌟','Senior World Explorer','Twenty true stories read!'],[30,'🏆','World Science Editor','Every true story read. Amazing reporting!']];
  function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function qs(k){ return new URLSearchParams(location.search).get(k); }

  /* ---------- optional read-aloud (UK English, Kate when available) ---------- */
  var RATES = {normal:.95, slow:.8, vslow:.65}, LABEL = {normal:'Normal', slow:'Slow', vslow:'Very slow'};
  var speed = load('sq-speed') || 'normal', speaking = false;
  var canSpeak = 'speechSynthesis' in window;
  /* Pick the most natural-sounding lady's voice the device has. Novelty and robotic voices are never used. */
  var BAD = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|daniel|arthur|oliver|george|ryan|thomas|alfie|elliot|noah|guy|male\b|aaron|gordon|lee\b|rishi|nathan|tom\b|evan|alex\b|eloquence/i;
  var PREF = [/libby.*natural/i,/maisie.*natural/i,/sonia.*natural/i,/mia.*natural/i,/aria.*natural/i,/jenny.*natural/i,/serena.*(premium|enhanced)/i,/stephanie.*(premium|enhanced)/i,/martha.*(premium|enhanced)/i,/kate.*(premium|enhanced)/i,/google uk english female/i,/serena/i,/stephanie/i,/martha/i,/hazel/i,/susan/i,/libby/i,/sonia/i,/kate/i,/samantha.*(premium|enhanced)/i,/ava.*(premium|enhanced)/i,/samantha/i,/karen/i,/moira/i,/tessa/i,/google us english/i];
  function goodVoices(){
    var v = canSpeak ? speechSynthesis.getVoices() : [];
    return v.filter(function(x){ return /^en/i.test(x.lang) && !BAD.test(x.name); });
  }
  function voice(){
    var v = goodVoices(), mine = load('sq-voice');
    if (mine) { var m = v.filter(function(x){return x.name===mine;})[0]; if (m) return m; }
    for (var i=0;i<PREF.length;i++){ var f = v.filter(function(x){return PREF[i].test(x.name);})[0]; if (f) return f; }
    return v.filter(function(x){return x.lang==='en-GB';})[0] || v[0] || null;
  }
  if (canSpeak) speechSynthesis.onvoiceschanged = function(){};
  /* Expressive reading: the text is split into sentences and phrases, each spoken separately,
     with real pauses after full stops and commas, a brighter voice for speech in quotation marks,
     a lift for questions and extra energy for exclamations. */
  var talkId = 0, timer = null;
  function stopTalk(){ talkId++; clearTimeout(timer); if (canSpeak) speechSynthesis.cancel(); speaking = false; document.querySelectorAll('.w.hl').forEach(function(w){w.classList.remove('hl');}); var b=document.getElementById('listen'); if(b) b.setAttribute('aria-pressed','false'); }
  function chunks(text){
    var out = [], re = /[^.!?,;:…“”"]+[.!?,;:…]*["”]?\s*|["“”]\s*/g, m, inQ = false;
    while ((m = re.exec(text))) {
      var seg = m[0], start = m.index;
      if (/^["“”]\s*$/.test(seg)) { inQ = !inQ; continue; }
      var t = seg.replace(/["“”]/g,'').trim(); if (!/[A-Za-z0-9]/.test(t)) continue;
      var endQ = /["”]\s*$/.test(seg);
      var lead = seg.search(/\S/); if (lead < 0) lead = 0;
      var p = /[.!?…]["”]?\s*$/.test(seg) ? 'full' : /[,;:]["”]?\s*$/.test(seg) ? 'comma' : 'none';
      out.push({t:t, at:start+lead, q:inQ, end:p, ex:/!/.test(seg), ask:/\?/.test(seg)});
      if (endQ) inQ = false;
    }
    return out.length ? out : [{t:text, at:0, q:false, end:'full'}];
  }
  /* Sound words are spoken as sounds, not spelt out letter by letter. Add more here as stories need them. */
  var SOUNDS = [
    [/\bb+z{2,}\b/gi, 'buzzzz'], [/\bz{3,}\b/gi, 'snore, snore'], [/\bh+m{2,}\b/gi, 'hmmm'], [/\bsh{2,}\b/gi, 'shhhh'],
    [/\bgr{2,}\b/gi, 'grrrrr'], [/\bbr{2,}\b/gi, 'brrrrr'], [/\bm{3,}\b/gi, 'mmmm'], [/\bpsst\b/gi, 'pssst'],
    [/\bt+h?w+a+n+g+\b/gi, 'twang'], [/\bthw+i+p+\b/gi, 'thwip'], [/\bb+o+n+g+\b/gi, 'bong'], [/\bt+i+n+g+\b/gi, 'ting'],
    [/\bw+h+o+o+s+h+\b/gi, 'whoosh'], [/\b([a-z])\1{3,}\b/gi, function(w){ return w.charAt(0) + w.charAt(0) + w.charAt(0); }]
  ];
  function speakable(t){
    SOUNDS.forEach(function(p){ t = t.replace(p[0], p[1]); });
    return t.replace(/\b[A-Z]{3,}\b/g, function(w){ return /^(BONG|BOOM|BANG)/.test(w) ? w.toLowerCase() : w.charAt(0) + w.slice(1).toLowerCase(); });
  }
  function say(text, onWord, onEnd){
    if (!canSpeak) return;
    stopTalk();
    var my = ++talkId, list = chunks(text), i = 0, v = voice(), base = RATES[speed];
    var gap = {full: speed==='normal'?420:speed==='slow'?560:700, comma: speed==='normal'?170:speed==='slow'?240:320, none: 60};
    speaking = true;
    (function next(){
      if (my !== talkId) return;
      if (i >= list.length) { speaking = false; if (onEnd) onEnd(); return; }
      var c = list[i++], u = new SpeechSynthesisUtterance(speakable(c.t));
      if (v) u.voice = v; u.lang = v ? v.lang : 'en-GB';
      var pitch = 1.08, rate = base;
      if (c.q) { pitch += 0.12; rate += 0.03; }          // a character speaking
      if (c.ask) { pitch += 0.08; }                       // a question lifts
      if (c.ex) { pitch += 0.1; rate += 0.05; }           // excitement
      if (/^(then|suddenly|just then|at last|but)\b/i.test(c.t)) rate -= 0.05; // build a little suspense
      u.pitch = Math.min(pitch, 1.5); u.rate = rate;
      if (onWord) { onWord(c.at); u.onboundary = function(e){ if (e.name==='word' || e.name===undefined) onWord(c.at + e.charIndex); }; }
      u.onend = function(){ if (my !== talkId) return; var g = gap[c.end]; if (c.q && list[i] && !list[i].q && /^[a-z]/.test(list[i].t)) g = gap.comma; timer = setTimeout(next, g); };
      u.onerror = u.onend;
      speechSynthesis.speak(u);
    })();
  }

  /* ---------- world map (simple outline, equirectangular) ---------- */
  var LAND = [
    [[-168,66],[-140,70],[-95,72],[-80,63],[-60,55],[-66,45],[-80,32],[-81,25],[-97,26],[-97,18],[-87,15],[-78,8],[-85,10],[-105,20],[-112,30],[-125,40],[-125,49],[-135,58],[-150,60],[-165,60]],
    [[-55,82],[-20,82],[-20,70],[-42,60],[-55,65]],
    [[-78,8],[-60,10],[-50,0],[-35,-6],[-40,-22],[-55,-35],[-65,-42],[-68,-55],[-73,-48],[-72,-30],[-71,-18],[-81,-5],[-78,2]],
    [[-10,36],[-9,44],[-2,44],[-5,48],[5,53],[8,57],[5,62],[15,69],[28,71],[40,67],[60,68],[60,45],[40,42],[28,41],[22,37],[15,38],[12,44],[3,42]],
    [[-5,50],[1,51],[2,53],[-2,57],[-5,58],[-6,56],[-4,54]],
    [[-17,15],[-17,21],[-10,30],[-6,35],[10,37],[20,32],[32,31],[35,28],[43,12],[51,12],[40,-2],[40,-15],[33,-25],[27,-34],[18,-34],[12,-18],[13,-5],[9,4],[-4,5],[-12,8]],
    [[44,-12],[50,-15],[48,-25],[44,-22]],
    [[28,41],[36,36],[35,30],[43,13],[52,16],[58,22],[56,26],[66,25],[72,20],[78,8],[82,16],[90,22],[98,16],[103,2],[105,10],[110,20],[122,30],[122,40],[130,43],[140,50],[143,58],[160,60],[180,66],[180,70],[140,73],[100,78],[70,73],[60,68],[60,45],[40,42]],
    [[130,31],[140,35],[142,40],[141,45],[139,40],[132,34]],
    [[95,5],[105,-6],[115,-8],[120,-5],[118,2],[110,2]],
    [[114,-22],[122,-18],[131,-12],[137,-12],[142,-11],[146,-19],[153,-28],[150,-37],[140,-38],[132,-32],[116,-35],[114,-26]],
    [[11,78],[22,80],[26,77],[16,76]],
    [[-180,-70],[-120,-73],[-60,-64],[-30,-76],[0,-70],[60,-67],[120,-66],[180,-70],[180,-90],[-180,-90]]
  ];
  function xy(lon, lat){ return [(lon+180), (90-lat)]; }
  function map(pins, opts){
    opts = opts || {};
    var s = '<svg class="wmap" viewBox="0 0 360 180" role="img" aria-label="World map">';
    for (var y=0;y<=180;y+=30) s += '<path d="M0 '+y+' H360" stroke="#C9E3F0" stroke-width=".4"/>';
    for (var x=0;x<=360;x+=30) s += '<path d="M'+x+' 0 V180" stroke="#C9E3F0" stroke-width=".4"/>';
    LAND.forEach(function(p){ s += '<path class="land" d="M'+p.map(function(c){ var q = xy(c[0],c[1]); return q[0].toFixed(1)+' '+q[1].toFixed(1); }).join(' L')+'Z"/>'; });
    pins.forEach(function(a){
      if (a.lat == null) return;
      var q = xy(a.lon, a.lat), r = opts.big ? 4.5 : 3.6, lab = opts.big ? a.place.split(',')[0] : '';
      var done = (S.data().badges||{})[a.id];
      s += '<g class="pin" data-go="'+a.id+'"><title>'+esc(a.title)+' · '+esc(a.place)+'</title>'+
        '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(r+3)+'" fill="'+(done?'#47A86A':'#D2425E')+'" opacity=".22"/>'+
        '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+r+'" fill="'+(done?'#47A86A':'#D2425E')+'" stroke="#fff" stroke-width="1.2"/>'+
        (lab ? '<text x="'+(q[0]+7)+'" y="'+(q[1]+2.5)+'" style="paint-order:stroke;stroke:#fff;stroke-width:2.5px">'+esc(lab)+'</text>' : '')+'</g>';
    });
    return s + '</svg>';
  }

  /* ---------- bar chart ---------- */
  function chart(c){
    var max = Math.max.apply(null, c.bars.map(function(b){ return b[1]; })) || 1, rowH = 34, lw = 118, W2 = 300, h = c.bars.length*rowH + 6;
    var s = '<svg class="chart" viewBox="0 0 '+W2+' '+h+'" width="100%" role="img" aria-label="'+esc(c.title)+'">';
    c.bars.forEach(function(b, i){
      var y = i*rowH + 4, w = Math.max(2, (W2 - lw - 52) * b[1] / max);
      s += '<text x="'+(lw-6)+'" y="'+(y+18)+'" text-anchor="end">'+esc(b[0])+'</text>'+
        '<rect x="'+lw+'" y="'+(y+4)+'" width="'+w.toFixed(1)+'" height="20" rx="6" fill="'+['#16918C','#7559D1','#F6B93B','#47A86A','#E0607E'][i%5]+'"/>'+
        '<text class="val" x="'+(lw+w+5)+'" y="'+(y+18)+'">'+b[1].toLocaleString('en-GB')+'</text>';
    });
    return s + '</svg>';
  }

  /* ---------- the list ---------- */
  function myGrade(){ var me = S.me(); var g = qs('g') || (me && me.grade) || load('sq-wgrade') || 'g2'; return GN[g] ? g : 'g2'; }
  function rank(n){ var r = null; RANKS.forEach(function(x){ if (n >= x[0]) r = x; }); return r; }
  function list(){
    stopTalk();
    var g = myGrade(), d = S.data(), mine = W.filter(function(a){ return a.grade===g; });
    var done = W.filter(function(a){ return d.badges[a.id]; }).length, r = rank(done), nx = RANKS.filter(function(x){ return x[0] > done; })[0];
    var h = '<div class="lhead"><span class="stamp">TRUE STORIES</span><h1 style="margin-top:12px">Science Around the World</h1>'+
      '<p>Real places. Real people. Real science. Read true news reports and diaries from around the world, look at the facts and charts, and become a Science Reporter.</p></div>';
    h += '<div class="wfilter">'+Object.keys(GN).map(function(k){ return '<a class="grade'+(k===g?' on':'')+'" href="world.html?g='+k+'" data-g="'+k+'">'+GN[k]+'</a>'; }).join('')+'</div>';
    h += '<div class="rank">'+(r ? '<span class="med">'+r[1]+'</span><div><b>'+r[2]+'</b><small>'+r[3]+(nx?' Read '+(nx[0]-done)+' more to become a '+nx[2]+'.':'')+'</small></div>'
         : '<span class="med">🗞️</span><div><b>Become a Science Reporter</b><small>Read your first true story and answer the questions to earn your press badge.</small></div>')+'</div>';
    h += '<div class="wmapbox">'+map(mine, {big:true})+'<p class="cnote" style="text-align:center">Tap a pin to read the true story from that place. Green pins are stories you have read.</p></div>';
    h += '<div class="wgrid">'+mine.map(function(a){ var ok = d.badges[a.id], t = TYPE[a.type];
      return '<a class="wcard'+(ok?' done':'')+'" href="world.html?a='+a.id+'">'+(ok?'<span class="tick">✅</span>':'')+
        '<span class="wtype '+a.type+'">'+t[0]+' '+t[1]+'</span><div class="ic">'+a.art.map(function(k){ return A.icon(k,40); }).join('')+'</div>'+
        '<h3>'+esc(a.title)+'</h3><p>'+esc(a.sum)+'</p><span class="meta">📍 '+esc(a.place)+' · '+esc((a.topicName||TOPIC[a.topic])||'')+'</span></a>'; }).join('')+'</div>';
    main.innerHTML = h;
    main.querySelectorAll('[data-g]').forEach(function(b){ b.onclick = function(e){ e.preventDefault(); store('sq-wgrade', b.dataset.g); history.replaceState(null,'','world.html?g='+b.dataset.g); list(); }; });
    pinClicks();
    window.scrollTo(0,0);
  }
  function pinClicks(){ main.querySelectorAll('[data-go]').forEach(function(p){ p.onclick = function(){ location.href = 'world.html?a='+p.dataset.go; }; }); }

  /* ---------- an article ---------- */
  function words(t, gl){
    return esc(t).replace(/\[\[(.+?)\]\]/g, function(m, w){ return '<button class="vocab" data-w="'+esc(w)+'">'+w+'</button>'; });
  }
  function plain(t){ return t.replace(/\[\[(.+?)\]\]/g, '$1'); }
  function article(a){
    stopTalk();
    var t = TYPE[a.type], h = '<p style="margin:18px 0 0"><a class="chipbtn" href="world.html?g='+a.grade+'">← All true stories</a></p>';
    h += '<div class="whero"><div><span class="stamp">TRUE STORY</span> <span class="wtype '+a.type+'" style="margin-left:10px">'+t[0]+' '+t[1]+'</span>'+
      '<h1>'+esc(a.title)+'</h1><p style="font-size:17px;color:var(--ink2);line-height:1.6;margin:0 0 12px">'+esc(a.sum)+'</p>'+
      '<div class="wwhere"><span>📍 '+esc(a.place)+'</span><span>🌍 '+esc(a.continent)+'</span><span>📅 '+esc(a.when)+'</span><span>🔬 '+esc((a.topicName||TOPIC[a.topic])||'')+'</span></div>'+
      (a.lat==null ? '<div class="wmapbox" style="margin-top:14px;text-align:center;padding:26px"><p style="font-size:20px;font-weight:800;margin:0">'+esc(a.away||'This story happens in space.')+'</p></div>' : '<div class="wmapbox" style="margin-top:14px">'+map([a])+'</div>')+'</div>'+
      '<figure class="wphoto"><img'+(a.photo.fit?' style="object-fit:contain;background:#F4F1EA"':'')+' src="'+esc(a.photo.src)+'" alt="'+esc(a.photo.caption)+'" onerror="this.outerHTML=\'<div class=ph>'+a.art.map(function(k){ return A.icon(k,90).replace(/"/g,'&quot;'); }).join('')+'</div>\'">'+
      '<figcaption><b>Photo:</b> '+esc(a.photo.caption)+(a.photo.credit?' <small>('+esc(a.photo.credit)+')</small>':'')+'</figcaption></figure></div>';
    // the text and the side boxes
    h += '<div class="wbody"><article class="wtext '+a.type+'" id="wtext">'+
      (a.diaryNote ? '<p class="wnote">📔 This diary is imagined, but everything in it is true: the place, the science and the numbers are all real.</p>' : '')+
      (canSpeak ? '<p style="margin:0 0 14px;font-family:Nunito,sans-serif"><button class="chipbtn" id="listen" aria-pressed="false">🔊 Read it to me</button></p>' : '')+
      a.sections.map(function(s){ return '<h2>'+esc(s.h)+'</h2><p>'+words(s.t)+'</p>'; }).join('')+'</article><aside class="wside">';
    h += '<div class="wbox ff"><h3>🗂️ Fact file</h3><table class="fact">'+a.fact.map(function(f){ return '<tr><td>'+esc(f[0])+'</td><td>'+esc(f[1])+'</td></tr>'; }).join('')+'</table></div>';
    if (a.chart) h += '<div class="wbox"><h3>📊 '+esc(a.chart.title)+'</h3>'+chart(a.chart)+(a.chartNote?'<p class="cnote">'+esc(a.chartNote)+'</p>':'')+'</div>';
    if (a.timeline) h += '<div class="wbox"><h3>🕰️ Timeline</h3><ul class="tl">'+a.timeline.map(function(x){ return '<li><b>'+esc(x[0])+'</b>'+esc(x[1])+'</li>'; }).join('')+'</ul></div>';
    if (a.key) h += '<div class="wbox"><h3>🔑 '+esc(a.key.title)+'</h3>'+a.key.steps.map(function(k,i){ return '<div class="kstep"><b>'+(i+1)+'</b><div><strong>'+esc(k[0])+'</strong><br>'+esc(k[1])+'</div></div>'; }).join('')+'</div>';
    h += '<div class="wbox"><h3>📖 Word bank</h3>'+Object.keys(a.glossary).map(function(k){ return '<p style="margin:0 0 8px;font-size:14.5px;line-height:1.45"><b style="color:var(--plum)">'+esc(k)+'</b>: '+esc(a.glossary[k])+'</p>'; }).join('')+'</div>';
    h += '</aside></div><p style="text-align:center;margin:26px 0"><button class="btn pri" id="toq">I have read it. Questions time! ➜</button></p><div id="qzone"></div>';
    main.innerHTML = h; window.scrollTo(0,0);
    pinClicks();
    main.querySelectorAll('.vocab').forEach(function(b){ b.onclick = function(){ var w = b.dataset.w, d = a.glossary[w]; showDef(b, w, d); say(w+'. '+d); }; });
    var L = document.getElementById('listen');
    if (L) L.onclick = function(){
      if (speaking) { stopTalk(); return; }
      L.setAttribute('aria-pressed','true');
      var text = a.sections.map(function(s){ return s.h+'. '+plain(s.t); }).join(' ');
      say(text, null, function(){ L.setAttribute('aria-pressed','false'); });
    };
    document.getElementById('toq').onclick = function(){ stopTalk(); quiz(a); };
  }
  function showDef(el, w, d){
    var old = document.getElementById('defpop'); if (old) old.remove();
    var p = document.createElement('div'); p.id = 'defpop';
    p.style.cssText = 'position:absolute;z-index:30;max-width:280px;background:#fff;border:2px solid var(--plum);border-radius:14px;padding:10px 12px;font:700 15px Nunito,sans-serif;color:var(--ink);box-shadow:0 12px 30px -12px rgba(0,0,0,.35);line-height:1.45';
    p.innerHTML = '<b style="color:var(--plum)">'+esc(w)+'</b><br>'+esc(d);
    var r = el.getBoundingClientRect(); p.style.left = Math.max(8, r.left + scrollX - 20)+'px'; p.style.top = (r.bottom + scrollY + 6)+'px';
    document.body.appendChild(p); setTimeout(function(){ document.addEventListener('click', function f(e){ if (e.target!==el) { p.remove(); document.removeEventListener('click', f); } }); }, 0);
  }

  /* ---------- questions: 7 non-fiction reading skills ---------- */
  function quiz(a){
    var i = 0, first = 0, res = [], types = {}, box = document.getElementById('qzone');
    document.getElementById('toq').parentNode.hidden = true;
    function one(){
      var q = a.q[i], opts = shuffle(q.o.map(function(o,k){ return {t:o, ok:k===0}; })), tries = 0;
      box.innerHTML = '<div class="wq" id="wq"><div class="qdots">'+a.q.map(function(x,k){ return '<i class="'+(k<i?(res[k]?'ok':'no'):k===i?'now':'')+'"></i>'; }).join('')+'</div>'+
        '<span class="qtype">'+esc(q.type)+'</span><h2>'+(i+1)+'. '+esc(q.q)+'</h2>'+
        opts.map(function(o,k){ return '<button class="opt" data-k="'+k+'">'+esc(o.t)+'</button>'; }).join('')+'<div id="qfb"></div>'+
        '<p class="cnote">Tip: you can scroll up and look back at the text, the fact file and the chart. Good reporters always check!</p></div>';
      box.scrollIntoView({behavior:'smooth', block:'start'});
      box.querySelectorAll('.opt').forEach(function(b){ b.onclick = function(){
        if (b.disabled) return; var o = opts[+b.dataset.k]; tries++;
        if (o.ok) {
          b.classList.add('right'); box.querySelectorAll('.opt').forEach(function(x){ x.disabled = true; });
          var ok1 = tries===1; res[i] = ok1; if (ok1) first++;
          types[q.type] = types[q.type] || [0,0]; types[q.type][1]++; if (ok1) types[q.type][0]++;
          document.getElementById('qfb').innerHTML = '<div class="why">'+(ok1?'✅ Brilliant! ':'✅ You got there! ')+esc(q.why)+'</div><button class="btn pri" id="qn">'+(i<a.q.length-1?'Next question ➜':'See my result ➜')+'</button>';
          document.getElementById('qn').onclick = function(){ i++; if (i < a.q.length) one(); else finish(); };
        } else { b.classList.add('wrong'); b.disabled = true; document.getElementById('qfb').innerHTML = '<div class="why" style="background:#FFF5E3;color:#8a5a08">Not quite. Look back at the text and try again!</div>'; }
      }; });
    }
    function finish(){
      var d = S.data(), before = W.filter(function(x){ return d.badges[x.id]; }).length, had = !!d.badges[a.id];
      S.read(a.id, first, a.q.length, types); S.badge(a.id);
      var after = W.filter(function(x){ return S.data().badges[x.id]; }).length, r = rank(after), newRank = !had && RANKS.some(function(x){ return x[0]===after; });
      var pr = first/a.q.length, stars = pr>=1?3:pr>=.7?2:1;
      box.innerHTML = '<div class="wq" style="text-align:center"><div class="pressbadge"><span class="em">'+(r?r[1]:'🗞️')+'</span><b>'+esc(r?r[2]:'Science Reporter')+'</b><small style="font-weight:700;color:var(--muted)">'+esc(a.place)+'</small></div>'+
        '<h2>You got '+first+' out of '+a.q.length+' right first time! '+'★★★'.slice(0,stars)+'☆☆☆'.slice(0,3-stars)+'</h2>'+
        (newRank ? '<p style="font-weight:800;color:var(--plum);font-size:18px">🎉 New press badge: '+esc(r[2])+'!</p>' : '')+
        (!had ? '<p class="coinwin" style="font-weight:900">🪙 +20 coins for reading a true story</p>' : '<p class="cnote">You have read this one before. Reading again makes you an even better reporter!</p>')+
        '<div class="around" style="text-align:left"><h3 style="margin:0 0 6px">🔎 Science around me</h3><p style="margin:0 0 10px;font-weight:700;color:var(--ink2)">Real scientists notice things every day. '+esc(a.around)+'</p>'+
        '<textarea id="arnd" placeholder="Write what you noticed..."></textarea><p class="fb" id="arfb" style="font-weight:800;color:var(--leaf)"></p><button class="btn pri" id="arsave">Save to my science journal</button></div>'+
        '<p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+nextBtn(a)+'<a class="btn sec" href="world.html?g='+a.grade+'">All true stories</a><button class="btn sec" id="again">Read it again</button></p></div>';
      box.scrollIntoView({behavior:'smooth', block:'start'});
      document.getElementById('again').onclick = function(){ article(a); };
      document.getElementById('arsave').onclick = async function(){
        var v = document.getElementById('arnd').value.trim(), fb = document.getElementById('arfb');
        if (v.length < 3) { fb.style.color = '#B23A57'; fb.textContent = 'Write a few words about what you noticed first.'; return; }
        this.disabled = true; await S.note({title:'Science around me: '+a.title, q:a.around, found:v});
        fb.style.color = ''; fb.textContent = '✅ Saved to your science journal. Your teacher can read it too.';
      };
      if (window.confetti) try{ confetti(); }catch(e){}
    }
    one();
  }
  function nextBtn(a){
    var d = S.data(), mine = W.filter(function(x){ return x.grade===a.grade; }), k = mine.indexOf(a);
    var n = mine.slice(k+1).concat(mine.slice(0,k)).filter(function(x){ return !d.badges[x.id]; })[0];
    return n ? '<a class="btn pri" href="world.html?a='+n.id+'">Next true story ➜</a>' : '';
  }

  function draw(){ var id = qs('a'), a = W.filter(function(x){ return x.id===id; })[0]; if (a) article(a); else list(); }
  S.chip(document.getElementById('who'), function(){ if (!qs('a')) list(); });
  draw();
})();
</script>
