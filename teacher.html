<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teachers | Science Quest by Curious Nest</title>
<link rel="icon" type="image/png" href="img/sq-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=45">
<style>
.tbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px}
.tbox h2{font-size:22px;margin-bottom:10px}
.fld{display:block;width:100%;font:700 16px Nunito,sans-serif;border:2px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);margin:6px 0 12px}
.fld:focus{outline:none;border-color:var(--teal)}
table.pt{width:100%;border-collapse:collapse;font-size:14px}
table.pt th,table.pt td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.pt th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.code{font:900 16px/1 Nunito,sans-serif;letter-spacing:.12em;background:var(--tealL);color:var(--tealD);padding:5px 8px;border-radius:8px;white-space:nowrap}
.mini{background:none;border:0;color:var(--teal);font:800 13px Nunito,sans-serif;cursor:pointer;padding:2px 4px}
.mini.red{color:#B23A57}
.cls{display:flex;flex-wrap:wrap;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ccode{border:2px dashed var(--teal);border-radius:16px;padding:16px;text-align:center;break-inside:avoid}
.ccode b{display:block;font-size:20px}
.ccode .code{display:inline-block;font-size:26px;margin:8px 0}
.ccode small{display:block;color:var(--muted);font-weight:700}
.scroll{overflow-x:auto}
.tabb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font:800 14px Nunito,sans-serif;cursor:pointer;color:var(--ink2)}.tabb.on{border-color:var(--teal);background:#E6F5F3;color:var(--tealD)}
.linkb{border:0;background:none;color:var(--teal);font:800 14px Nunito,sans-serif;cursor:pointer;text-decoration:underline}
.sqok{color:#2F7A4C;font-weight:800;margin:6px 0}
.glbar{display:grid;grid-template-columns:190px 1fr 60px;gap:8px;align-items:center;font-weight:800;font-size:14px;margin:7px 0}.glbar .bar{height:14px;background:#EEF1F5;border-radius:99px;overflow:hidden}.glbar .bar b{display:block;height:100%;border-radius:99px}
.glcols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media (max-width:700px){.glcols{grid-template-columns:1fr}.glbar{grid-template-columns:120px 1fr 50px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top noprint">
  <div class="wrap bar">
    <a class="brand" href="index.html"><span class="mk"><img src="img/sq-bird.png" alt=""></span><span><b>Science Quest</b><small>Teachers</small></span></a>
    <span id="acct"></span>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="foot noprint"><div class="wrap"><span>Powered by <a href="https://thinknest.education">ThinkNest Education</a></span><span>Children’s progress is only visible to their own teacher.</span></div></footer>

<script src="js/art.js?v=45"></script>
<script src="js/kg2.js?v=45"></script>
<script src="js/g1.js?v=45"></script>
<script src="js/g2.js?v=45"></script>
<script src="js/g3.js?v=45"></script>
<script src="js/challenges.js?v=53"></script>
<script src="js/practice.js?v=45"></script>
<script src="js/practice-more.js?v=45"></script>
<script src="js/world.js?v=51"></script>
<script src="js/report.js?v=53"></script>
<script>
(function(){
  var sb = supabase.createClient('https://xpbkdnkfufkahaszfycd.supabase.co','sb_publishable_QIAV_9tLUBbDCu7FHqaTEw_zYQ0teEG');
  var GR = {kg2:'KG2 (Year 1)', g1:'Grade 1 (Year 2)', g2:'Grade 2 (Year 3)', g3:'Grade 3 (Year 4)', g4:'Grade 4 (Year 5)', g5:'Grade 5 (Year 6)'};
  var main = document.getElementById('main'), acct = document.getElementById('acct');
  var classes = [], kids = [], prog = {}, cur = null;
  function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function fmt(c){ return c ? c.slice(0,3)+'-'+c.slice(3) : ''; }

  async function start(){
    var s = (await sb.auth.getSession()).data.session;
    if (!s) return login();
    acct.innerHTML = '<span style="font-weight:800;color:var(--muted);font-size:14px">'+esc((s.user.user_metadata||{}).name || s.user.email)+'</span> <button class="chipbtn" id="out">Sign out</button>';
    document.getElementById('out').onclick = async function(){ await sb.auth.signOut(); acct.innerHTML=''; login(); };
    await load(); home();
  }

  /* ---------- sign in, create an account, reset a password ---------- */
  var loginTab = 'in';
  function login(msg){
    var tabs = '<div style="display:flex;gap:8px;margin-bottom:14px"><button class="tabb'+(loginTab==='in'?' on':'')+'" data-lt="in">Sign in</button><button class="tabb'+(loginTab==='up'?' on':'')+'" data-lt="up">Create a teacher account</button></div>';
    var h = '<div class="tbox" style="max-width:460px;margin:40px auto">'+tabs;
    if (loginTab==='in') h += '<h2>Teacher sign in</h2>'+
      '<p style="color:var(--ink2);margin:0 0 12px">Already use Maths Quest or Spelling Bee? Sign in with the same email and password.</p>'+
      '<label class="jl" for="em">Email</label><input class="fld" id="em" type="email" autocomplete="username">'+
      '<label class="jl" for="pw">Password</label><input class="fld" id="pw" type="password" autocomplete="current-password">'+
      '<p class="sqerr" id="err"></p><p class="sqok" id="ok">'+(msg?esc(msg):'')+'</p><button class="btn pri" id="go">Sign in</button> <button class="linkb" id="forgot">Forgot your password?</button>';
    else h += '<h2>Create a teacher account</h2>'+
      '<p style="color:var(--ink2);margin:0 0 12px">Create classes, make code cards for your children and follow their progress.</p>'+
      '<label class="jl" for="nm2">Your name</label><input class="fld" id="nm2" autocomplete="name" placeholder="For example: Ms Sara Ahmed">'+
      '<label class="jl" for="sc2">School</label><input class="fld" id="sc2" autocomplete="organization">'+
      '<label class="jl" for="em">Email</label><input class="fld" id="em" type="email" autocomplete="username">'+
      '<label class="jl" for="pw">Password (at least 8 characters)</label><input class="fld" id="pw" type="password" autocomplete="new-password">'+
      '<label class="jl" for="pw2">Type the password again</label><input class="fld" id="pw2" type="password" autocomplete="new-password">'+
      '<p class="sqerr" id="err"></p><p class="sqok" id="ok"></p><button class="btn pri" id="mkacc">Create my account</button>';
    main.innerHTML = h + '</div>';
    main.querySelectorAll('[data-lt]').forEach(function(b){ b.onclick = function(){ loginTab = b.getAttribute('data-lt'); login(); }; });
    var err = document.getElementById('err'), ok = document.getElementById('ok');
    function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }
    if (loginTab==='in') {
      document.getElementById('go').onclick = async function(){
        var r = await sb.auth.signInWithPassword({email:val('em'), password:document.getElementById('pw').value});
        if (r.error){ err.textContent = /confirm/i.test(r.error.message) ? 'Please confirm your email first. Check your inbox for the link we sent you.' : 'That email or password did not work. Please try again.'; return; }
        start();
      };
      document.getElementById('forgot').onclick = async function(){
        var em = val('em'); err.textContent = ''; ok.textContent = '';
        if (!/@/.test(em)) { err.textContent = 'Type your email address above first, then press “Forgot your password?” again.'; return; }
        var r = await sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname});
        if (r.error) err.textContent = 'Sorry, that did not work. Please try again in a minute.';
        else ok.textContent = 'We have sent a link to ' + em + '. Open it to choose a new password.';
      };
    } else {
      document.getElementById('mkacc').onclick = async function(){
        err.textContent = ''; ok.textContent = '';
        var nm = val('nm2'), sc = val('sc2'), em = val('em'), pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
        if (!nm) return err.textContent = 'Please type your name.';
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return err.textContent = 'Please type a valid email address.';
        if (pw.length < 8) return err.textContent = 'Your password needs at least 8 characters.';
        if (pw !== pw2) return err.textContent = 'The two passwords are different. Please type them again.';
        var b = document.getElementById('mkacc'); b.disabled = true; b.textContent = 'Creating your account…';
        var r = await sb.auth.signUp({email:em, password:pw, options:{data:{name:nm, school:sc, role:'teacher', app:'science-quest'}, emailRedirectTo: location.origin + location.pathname}});
        b.disabled = false; b.textContent = 'Create my account';
        if (r.error) { err.textContent = /registered|exists/i.test(r.error.message) ? 'There is already an account with this email. Use “Sign in” instead.' : 'Sorry, that did not work: ' + r.error.message; return; }
        if (r.data && r.data.session) { start(); return; }
        loginTab = 'in'; login('Nearly there! We have sent an email to ' + em + '. Click the link in it to confirm your account, then sign in here.');
      };
    }
  }
  function newPassword(){
    main.innerHTML = '<div class="tbox" style="max-width:460px;margin:40px auto"><h2>Choose a new password</h2>'+
      '<label class="jl" for="pw">New password (at least 8 characters)</label><input class="fld" id="pw" type="password" autocomplete="new-password">'+
      '<label class="jl" for="pw2">Type it again</label><input class="fld" id="pw2" type="password" autocomplete="new-password">'+
      '<p class="sqerr" id="err"></p><button class="btn pri" id="setpw">Save my new password</button></div>';
    document.getElementById('setpw').onclick = async function(){
      var pw = document.getElementById('pw').value, err = document.getElementById('err');
      if (pw.length < 8) return err.textContent = 'Your password needs at least 8 characters.';
      if (pw !== document.getElementById('pw2').value) return err.textContent = 'The two passwords are different.';
      var r = await sb.auth.updateUser({password:pw});
      if (r.error) return err.textContent = 'Sorry, that did not work: ' + r.error.message;
      start();
    };
  }
  sb.auth.onAuthStateChange(function(ev){ if (ev === 'PASSWORD_RECOVERY') setTimeout(newPassword, 0); });

  async function load(){
    var a = await sb.from('sq_classes').select('*').order('grade').order('name');
    var b = await sb.from('sq_students').select('*').order('first_name');
    var c = await sb.from('sq_progress').select('*');
    if (a.error){ main.innerHTML = '<div class="tbox"><h2>Almost ready</h2><p>Science Quest’s database has not been set up yet. Please run <b>science-quest-codes.sql</b> in Supabase first.</p></div>'; throw a.error; }
    classes = a.data||[]; kids = b.data||[]; prog = {}; (c.data||[]).forEach(function(p){ prog[p.student_id] = p; });
  }

  function ready(g){ return !!(window.SQ_GRADE[g] || (window.SQ_PRAC||{})[g]); }
  function home(){
    var h = '<div class="lhead"><h1>My classes</h1><p>Create a class, add your children’s first names, and give each child their code card. Their badges, challenge stars, journals, science knowledge and reading appear here.</p></div>';
    h += '<div class="tbox"><h2>Classes</h2>'+(classes.length?'<div class="cls">'+classes.map(function(c){ var n = kids.filter(function(k){return k.class_id===c.id;}).length;
        return '<button class="grade'+(cur===c.id?' on':'')+'" data-c="'+c.id+'">'+esc(c.name)+'<small>'+GR[c.grade]+' · '+n+' children</small></button>'; }).join('')+'</div>':'<p style="color:var(--muted);font-weight:700">No classes yet.</p>')+
      '<details style="margin-top:14px"><summary style="cursor:pointer;font-weight:900;color:var(--teal)">+ New class</summary>'+
      '<label class="jl" for="cn">Class name</label><input class="fld" id="cn" placeholder="For example: 1B">'+
      '<label class="jl" for="cg">Grade</label><select class="fld" id="cg">'+Object.keys(GR).map(function(g){return '<option value="'+g+'"'+(ready(g)?'':' disabled')+'>'+GR[g]+(ready(g)?'':' (coming soon)')+'</option>';}).join('')+'</select>'+
      '<p class="sqerr" id="mkerr"></p><button class="btn pri" id="mk">Create class</button></details></div>';
    if (cur) h += classView();
    main.innerHTML = h;
    main.querySelectorAll('[data-c]').forEach(function(b){ b.onclick = function(){ cur = b.getAttribute('data-c'); home(); }; });
    document.getElementById('mk').onclick = async function(){
      var n = document.getElementById('cn').value.trim(), er = document.getElementById('mkerr'), b = this;
      er.textContent = '';
      if (!n) { er.textContent = 'Please type a class name first, for example 4B.'; document.getElementById('cn').focus(); return; }
      b.disabled = true; b.textContent = 'Creating…';
      var r = await sb.from('sq_classes').insert({name:n, grade:document.getElementById('cg').value}).select();
      b.disabled = false; b.textContent = 'Create class';
      if (r.error || !r.data || !r.data.length) { er.textContent = 'Sorry, the class could not be created' + (r.error ? ': ' + r.error.message : '. Please sign out, sign in again and try once more.'); return; }
      cur = r.data[0].id; await load(); home();
    };
    if (cur) bindClass();
  }

  function classView(){
    var c = classes.filter(function(x){return x.id===cur;})[0]; if (!c) return '';
    var G = window.SQ_GRADE[c.grade] || {topics:(window.SQ_CHAL_TOPICS||{})[c.grade] || [], stories:[]}, CH = (window.SQ_CHAL||{})[c.grade] || {};
    var ks = kids.filter(function(k){return k.class_id===cur;});
    var h = '<div class="tbox"><h2>'+esc(c.name)+' · '+GR[c.grade]+'</h2>'+
      '<label class="jl" for="nm">Add children (one first name per line)</label><textarea class="jt" id="nm" placeholder="Amira&#10;Noah&#10;Priya"></textarea>'+
      '<p style="margin-top:10px"><button class="btn pri" id="add">Add children and make codes</button> '+(ks.length?'<button class="btn sec" id="cards">🖨 Print code cards</button>':'')+' <button class="mini red" id="delc">Delete this class</button></p></div>';
    if (!ks.length) return h;
    h += '<div class="tbox"><h2>Progress</h2><div class="scroll"><table class="pt"><tr><th>Child</th><th>Code</th><th>Stories</th>'+
      G.topics.map(function(t){ return '<th>'+esc(t.name)+'<br><span style="text-transform:none;letter-spacing:0">quiz · mysteries · hands-on</span></th>'; }).join('')+'<th>Journal</th><th></th></tr>';
    ks.forEach(function(k){
      var p = prog[k.id] || {badges:{}, stars:{}, hands:{}, journal:[]};
      var nb = G.stories.filter(function(s){ return p.badges[s.id]; }).length;
      h += '<tr><td><b>'+esc(k.first_name)+'</b></td><td><span class="code">'+fmt(k.code)+'</span></td><td>'+nb+' / '+G.stories.length+'</td>'+
        G.topics.map(function(t){ var ch = CH[t.id]; if (!ch) return '<td>-</td>';
          var q = p.stars['quiz-'+c.grade+'-'+t.id]||0, m = ch.mystery.filter(function(x){ return p.stars['myst-'+x.id]; }).length;
          return '<td>'+('★★★'.slice(0,q)+'☆☆☆'.slice(0,3-q))+' · '+m+'/'+ch.mystery.length+' · '+(p.hands[ch.hands.id]?'✅':'–')+'</td>'; }).join('')+
        '<td>'+(p.journal.length?'<button class="mini" data-j="'+k.id+'">'+p.journal.length+' entries</button>':'0')+'</td>'+
        '<td><button class="mini" data-nc="'+k.id+'">New code</button> <button class="mini red" data-dk="'+k.id+'">Remove</button></td></tr>';
    });
    h += '</table></div></div>';
    // science knowledge against every curriculum objective, and reading
    var objs = (window.SQ_PRAC||{})[c.grade] || [], R = window.SQ_REPORT;
    h += '<div class="tbox"><h2>Science knowledge and reading</h2><p style="color:var(--ink2);font-weight:700;margin:0 0 10px">Each column is a National Curriculum objective from Science Practice (hover or tap a number to see it). 🌟 = Super Scientist star, 🏆 = Grade Champion. Colours: '+
      R.LEVELS.map(function(L){ return '<span class="lvl" style="background:'+L.c+';color:'+L.t+'">'+L.n+'</span>'; }).join(' ')+'</p>';
    if (!objs.length) h += '<p style="color:var(--muted);font-weight:700">Science Practice for this grade is coming soon. Reading is shown below.</p>';
    h += '<div class="scroll"><table class="pt kgrid"><tr><th>Child</th>'+objs.map(function(o,i){ return '<th title="'+esc(o.short)+': '+esc(o.nc)+'">'+(i+1)+'</th>'; }).join('')+'<th>Secure</th><th>Stories read</th><th>Reading score</th><th></th></tr>';
    ks.forEach(function(k){
      var p = prog[k.id] || {}, sm = R.summary(c.grade, p), sk = p.skills || {};
      h += '<tr><td><b>'+esc(k.first_name)+'</b>'+(sk['champ-'+c.grade]?' 🏆':'')+'</td>'+objs.map(function(o){ var r = sk[o.id], L = R.LEVELS[R.level(r)];
          return '<td title="'+esc(o.short)+' · '+L.n+(r&&r.n?' · '+r.r+' of '+r.n+' right':'')+'" style="background:'+L.c+';color:'+L.t+';text-align:center;font-weight:900">'+(r&&r.n?Math.round(r.r/r.n*100)+'%':'')+((sk['sup-'+o.id]||{}).ok?' 🌟':'')+'</td>'; }).join('')+
        '<td><b>'+sm.counts[3]+'</b> / '+sm.objs+'</td><td>'+sm.read+' / '+sm.stories+'</td><td>'+(sm.comp==null?'–':Math.round(sm.comp*100)+'%')+'</td>'+
        '<td><button class="mini" data-rep="'+k.id+'">📄 Report</button></td></tr>';
    });
    // class average row
    if (objs.length) h += '<tr><td><b>Class</b></td>'+objs.map(function(o){ var n = 0, s = 0; ks.forEach(function(k){ var p = prog[k.id]; if (p && p.skills && p.skills[o.id]) { n++; s += R.level(p.skills[o.id])===3 ? 1 : 0; } });
        return '<td style="text-align:center;font-size:12px;font-weight:800;color:var(--muted)">'+(n ? s+'/'+n : '')+'</td>'; }).join('')+'<td colspan="4" style="font-size:12px;color:var(--muted);font-weight:700">children secure / children who have tried</td></tr>';
    h += '</table></div><p style="margin-top:12px"><button class="btn sec" id="allrep">🖨 Print reports for every child</button></p>';
    if (objs.length) h += '<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:900;color:var(--teal)">Show the objectives</summary><ol style="font-weight:700;color:var(--ink2)">'+objs.map(function(o){ return '<li><b>'+esc(o.short)+'</b>: '+esc(o.nc)+'</li>'; }).join('')+'</ol></details>';
    h += '</div>';
    // where the class needs the most support
    if (objs.length) {
      var rows = objs.map(function(o){ var tried = [], sec = 0, a = 0, need = [], near = [];
        ks.forEach(function(k){ var r = ((prog[k.id]||{}).skills||{})[o.id]; if (!r || !r.n) return; var l = R.level(r); tried.push(k); a += R.acc(r); if (l===3) sec++; else if (l===1) need.push(k.first_name); else near.push(k.first_name); });
        return {o:o, n:tried.length, sec:sec, acc:tried.length ? a/tried.length : 0, need:need, near:near}; });
      var focus = rows.filter(function(x){ return x.n && x.sec < x.n; }).sort(function(p,q){ return (p.sec/p.n - q.sec/q.n) || (p.acc - q.acc); }).slice(0,8);
      var none = rows.filter(function(x){ return !x.n; });
      h += '<div class="tbox"><h2>🎯 Areas to support</h2><p style="color:var(--ink2);font-weight:700;margin:0 0 10px">The objectives the class finds hardest, starting with the biggest need. Use the names to plan small-group support.</p>';
      if (!focus.length) h += '<p style="color:var(--muted);font-weight:700">'+(rows.some(function(x){return x.n;}) ? 'Every child who has practised is secure so far. Brilliant!' : 'No Science Practice yet. Areas to support will appear once children start practising.')+'</p>';
      else h += '<div class="scroll"><table class="pt"><tr><th>Objective</th><th>Class accuracy</th><th>Secure</th><th>Needs support</th><th>Nearly there</th></tr>'+focus.map(function(x){ var p = Math.round(x.acc*100), col = x.acc>=.8?'#47A86A':x.acc>=.5?'#F6B93B':'#E0607E';
          return '<tr><td><b>'+esc(x.o.short)+'</b><br><span style="font-size:12px;color:var(--muted);font-weight:600">'+esc(x.o.nc)+'</span></td>'+
            '<td style="min-width:130px"><span style="display:block;height:10px;background:#EEF1F5;border-radius:99px;overflow:hidden"><b style="display:block;height:100%;width:'+p+'%;background:'+col+'"></b></span><span style="font-size:12px;font-weight:800">'+p+'%</span></td>'+
            '<td>'+x.sec+' / '+x.n+'</td><td style="color:#9B2C4A;font-weight:800">'+(esc(x.need.join(', '))||'–')+'</td><td style="color:#8A5A00;font-weight:800">'+(esc(x.near.join(', '))||'–')+'</td></tr>'; }).join('')+'</table></div>';
      if (none.length && none.length < objs.length) h += '<p style="font-weight:700;font-size:13px;color:var(--ink2);margin:10px 0 0"><b>Not practised by anyone yet:</b> '+none.map(function(x){ return esc(x.o.short); }).join(', ')+'</p>';
      h += '</div>';
    }
    // GL Test Practice results
    (function(){
      var names = {B:'Biology', C:'Chemistry', P:'Physics', K:'Knowledge and understanding', A:'Application of knowledge', W:'Working scientifically'};
      var tot = {}, took = 0, rows = '';
      ks.forEach(function(k){
        var sk = (prog[k.id]||{}).skills || {}, A = sk['gl-'+c.grade], B = sk['gl-'+c.grade+'-B'], mine = {};
        [A, B].forEach(function(r){ if (!r || !r.by) return; for (var x in r.by){ tot[x] = tot[x] || [0,0]; tot[x][0] += r.by[x][0]; tot[x][1] += r.by[x][1]; mine[x] = mine[x] || [0,0]; mine[x][0] += r.by[x][0]; mine[x][1] += r.by[x][1]; } });
        if (A || B) took++;
        var weak = Object.keys(mine).filter(function(x){ return mine[x][1]; }).sort(function(p,q){ return mine[p][0]/mine[p][1] - mine[q][0]/mine[q][1]; })[0];
        function cell(r){ return r ? '<b>'+r.s+' / '+r.of+'</b> <span style="color:var(--muted);font-size:12px">('+Math.round(r.s/r.of*100)+'%, best '+r.best+', '+esc(r.d)+')</span>' : '<span style="color:var(--muted)">Not tried</span>'; }
        rows += '<tr><td><b>'+esc(k.first_name)+'</b></td><td>'+cell(A)+'</td><td>'+cell(B)+'</td><td>'+(weak && mine[weak][0]/mine[weak][1] < .7 ? esc(names[weak])+' ('+Math.round(mine[weak][0]/mine[weak][1]*100)+'%)' : (weak ? 'No weak area' : '–'))+'</td></tr>';
      });
      function bar(x){ var t = tot[x]; if (!t || !t[1]) return ''; var p = t[0]/t[1], col = p>=.8?'#47A86A':p>=.5?'#F6B93B':'#E0607E';
        return '<div class="glbar"><span>'+names[x]+'</span><span class="bar"><b style="width:'+Math.round(p*100)+'%;background:'+col+'"></b></span><span>'+Math.round(p*100)+'%</span></div>'; }
      h += '<div class="tbox"><h2>📝 GL Test Practice</h2><p style="color:var(--ink2);font-weight:700;margin:0 0 10px">'+took+' of '+ks.length+' children have taken a GL practice test. The chart shows the percentage of questions the class answered correctly in each area (latest try of Test A and Test B).</p>';
      if (took) {
        var areas = ['B','C','P','K','A','W'].filter(function(x){ return tot[x] && tot[x][1]; }).sort(function(p,q){ return tot[p][0]/tot[p][1] - tot[q][0]/tot[q][1]; });
        h += '<div class="glcols"><div><h3 style="font-size:16px">Science areas</h3>'+bar('B')+bar('C')+bar('P')+'</div><div><h3 style="font-size:16px">GL skill areas</h3>'+bar('K')+bar('A')+bar('W')+'</div></div>';
        if (areas.length) h += '<p style="background:var(--roseL);color:#7A2540;border-radius:12px;padding:10px 14px;font-weight:800;margin:12px 0">🎯 The class needs the most support with <b>'+esc(names[areas[0]])+'</b> ('+Math.round(tot[areas[0]][0]/tot[areas[0]][1]*100)+'% correct)'+(areas[1] ? ', then <b>'+esc(names[areas[1]])+'</b> ('+Math.round(tot[areas[1]][0]/tot[areas[1]][1]*100)+'%)' : '')+'.</p>';
        h += '<div class="scroll"><table class="pt"><tr><th>Child</th><th>Test A (latest)</th><th>Test B (latest)</th><th>Area to support</th></tr>'+rows+'</table></div>';
      } else h += '<p style="color:var(--muted);font-weight:700">No results yet. Children find the tests on the GL Practice page.</p>';
      h += '</div>';
    })();
    h += '<div id="jview"></div>';
    return h;
  }

  function bindClass(){
    var c = classes.filter(function(x){return x.id===cur;})[0];
    document.getElementById('add').onclick = async function(){
      var names = document.getElementById('nm').value.split(/\n|,/).map(function(s){return s.trim();}).filter(Boolean);
      if (!names.length) return;
      this.disabled = true;
      var r = await sb.rpc('sq_add_students', {p_class:cur, p_names:names});
      if (r.error) alert('Sorry, that did not work: ' + r.error.message);
      await load(); home();
    };
    var cards = document.getElementById('cards'); if (cards) cards.onclick = function(){
      var ks = kids.filter(function(k){return k.class_id===cur;});
      main.innerHTML = '<p class="noprint" style="margin-top:20px"><button class="btn pri" onclick="window.print()">🖨 Print</button> <button class="btn sec" id="bk">Back</button></p><div class="cards">'+
        ks.map(function(k){ return '<div class="ccode"><img src="img/sq-bird.png" alt="" width="40" height="40"><b>'+esc(k.first_name)+'</b><span class="code">'+fmt(k.code)+'</span><small>science.thinknest.education</small><small>'+esc(c.name)+' · Science Quest</small></div>'; }).join('')+'</div>';
      document.getElementById('bk').onclick = home;
    };
    document.getElementById('delc').onclick = async function(){
      if (!confirm('Delete '+c.name+' and all of its children’s progress? This cannot be undone.')) return;
      await sb.from('sq_classes').delete().eq('id', cur); cur = null; await load(); home();
    };
    main.querySelectorAll('[data-nc]').forEach(function(b){ b.onclick = async function(){
      if (!confirm('Make a new code for this child? Their old code will stop working.')) return;
      var r = await sb.rpc('sq_new_code_for', {p_student:b.getAttribute('data-nc')}); if (r.error) alert(r.error.message); await load(); home(); }; });
    main.querySelectorAll('[data-dk]').forEach(function(b){ b.onclick = async function(){
      if (!confirm('Remove this child and their progress? This cannot be undone.')) return;
      await sb.from('sq_students').delete().eq('id', b.getAttribute('data-dk')); await load(); home(); }; });
    function showReports(list){
      main.innerHTML = '<p class="noprint" style="margin-top:20px"><button class="btn pri" onclick="window.print()">🖨 Print</button> <button class="btn sec" id="bk">Back to class</button></p>'+
        list.map(function(k, i){ return '<div style="'+(i?'break-before:page;':'')+'">'+SQ_REPORT.html({name:k.first_name, cls:c.name, grade:c.grade, data:prog[k.id]||{}, forParents:true})+'</div>'; }).join('');
      document.getElementById('bk').onclick = home; window.scrollTo({top:0});
    }
    main.querySelectorAll('[data-rep]').forEach(function(b){ b.onclick = function(){ showReports(kids.filter(function(x){return x.id===b.getAttribute('data-rep');})); }; });
    var ar = document.getElementById('allrep'); if (ar) ar.onclick = function(){ showReports(kids.filter(function(k){return k.class_id===cur;})); };
    main.querySelectorAll('[data-j]').forEach(function(b){ b.onclick = function(){
      var k = kids.filter(function(x){return x.id===b.getAttribute('data-j');})[0], p = prog[k.id];
      document.getElementById('jview').innerHTML = '<div class="tbox"><h2>'+esc(k.first_name)+'’s science journal</h2>'+p.journal.map(function(e){
        return '<div class="jentry"><h4>'+esc(e.title||'Discovery')+'</h4><span class="d">'+esc(e.at)+'</span>'+(e.q?'<p><b>Question:</b> '+esc(e.q)+'</p>':'')+(e.guess?'<p><b>Predicted:</b> '+esc(e.guess)+'</p>':'')+(e.found?'<p><b>Found out:</b> '+esc(e.found)+'</p>':'')+'</div>'; }).join('')+'</div>';
      document.getElementById('jview').scrollIntoView({behavior:'smooth'});
    }; });
  }

  start();
})();
</script>
